# Publishes @mohankumarelec/monaco-editor to the public npm registry (registry.npmjs.org).
#
# Build matches README "Local Build": NODE_OPTIONS, npm ci, npm run build; the publishable
# package is produced under ./out/monaco-editor (see build/build-monaco-editor.ts).
#
# Required GitHub secret (repo: Settings → Secrets and variables → Actions):
#   NPM_TOKEN — npm automation token with permission to publish to the @mohankumarelec org
#   (create at https://www.npmjs.com/settings/~/tokens — "Granular access token" with
#   Packages read/write for scope @mohankumarelec, or a classic token with publish rights).

name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Build monaco-editor package
        run: npm run build

      # Scoped npm name for @mohankumarelec; artifact remains under out/monaco-editor.
      - name: Scope package for npm (@mohankumarelec)
        working-directory: ./out/monaco-editor
        run: |
          npm pkg set "name=@mohankumarelec/monaco-editor"
          npm pkg set "publishConfig.access=public"

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          provenance: true
          package: ./out/monaco-editor
